<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Session paused · Financial Intelligence Copilot</title>
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    background: #0B0F19; color: #F8FAFC;
    font-family: Inter, "Segoe UI", system-ui, sans-serif;
  }
  main {
    max-width: 440px; margin: 16px; padding: 32px; text-align: center;
    background: #1E293B; border: 1px solid #334155; border-radius: 12px;
  }
  h1 { font-size: 22px; margin: 0 0 12px; }
  p { color: #94A3B8; line-height: 1.5; margin: 0 0 24px; }
  a {
    display: inline-block; padding: 10px 20px; border-radius: 8px;
    background: #0284C7; color: #fff; text-decoration: none; font-weight: 600;
  }
  a:hover { background: #0369A1; }
</style>
</head>
<body>
<main>
  <h1>Session paused</h1>
  <p>The app was paused after <span id="idle">a period</span> without activity,
     so the server can shut down and stop billing. Your previous analysis is
     not kept.</p>
  <a href="/">Resume</a>
</main>
<script>
  // Idle window passed by the app (?minutes=N); only digits are accepted.
  const minutes = new URLSearchParams(location.search).get("minutes");
  if (minutes && /^\d{1,4}$/.test(minutes)) {
    document.getElementById("idle").textContent =
      minutes === "1" ? "1 minute" : `${minutes} minutes`;
  }
</script>
</body>
</html>

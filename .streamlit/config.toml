# Dark Slate Terminal tokens (see DESIGN.md).
[theme]
base = "dark"
primaryColor = "#0284C7"
backgroundColor = "#0B0F19"
secondaryBackgroundColor = "#1E293B"
textColor = "#F8FAFC"
borderColor = "#334155"
linkColor = "#38BDF8"
blueColor = "#38BDF8"
greenColor = "#10B981"
orangeColor = "#F59E0B"
grayColor = "#94A3B8"
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap, Segoe UI, sans-serif"
baseRadius = "8px"
metricValueFontSize = "24px"

[server]
# Serves app/static/ at /app/static/ (used by the idle "session paused" page).
enableStaticServing = true
